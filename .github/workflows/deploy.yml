name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint, test, and build
        run: npm run lint && npm test && npm run build
      - name: Check game page and /3d/ redirect
        run: |
          test -f dist/index.html && test -f dist/3d/index.html
          grep -q 'id="view"' dist/index.html
          grep -q "location.replace" dist/3d/index.html
          test -f dist/models/3d/byeolha_animated_mobile.glb
          test ! -f dist/models/3d/byeolha_animated.glb
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
